reader:
  name: ofw_l2
  short_name: OFW Level 2
  long_name: GOES-R Optical Flow Winds Level 2
  description: >
    NetCDF4 reader for Dense Optical Flow Wind data from the OCTANE Software --> https://github.com/JasonApke/OCTANE
  status: Beta
  supports_fsspec: false
  sensors: [abi]
  reader: !!python/name:satpy.readers.yaml_reader.FileYAMLReader
  # file pattern keys to sort files by with 'satpy.utils.group_files'
  group_keys: ['start_time', 'platform_shortname', 'scene_abbr']

#Using the glm and l1b files as a template for the OFW reader. 

file_types:
#Will likely have to add this for every channel 1-16
  ofw_l2_c02_imagery:
    file_reader: !!python/name:satpy.readers.ofw_l2.NCOFWL2 
    file_patterns: ['{system_environment:2s}_{mission_id:3s}-OFW-L2-{observation_type:3s}{scene_abbr:s}-{scan_mode:2s}C02_{platform_shortname:3s}_s{start_time:%Y%j%H%M%S%f}_e{end_time:%Y%j%H%M%S%f}_c{creation_time:%Y%j%H%M%S%f}.nc{nc_version}']
                    # '{system_environment:s}_{mission_id:3s}-L2-GLM{scene_abbr:s}-{scan_mode:2s}_{platform_shortname:3s}_s{start_time:%Y%j%H%M%S%f}_e{end_time:%Y%j%H%M%S%f}_c{creation_time:%Y%j%H%M%S%f}.nc']


datasets:
  # Additional datasets discovered dynamically in satpy/readers/glm_l2.py
  u_wnd:
    name: U
    resolution: 500
    units: m/s
    file_type: ofw_l2_c02_imagery
  v_wnd:
    name: V
    resolution: 500
    units: m/s
    file_type: ofw_l2_c02_imagery
  wspd:
    name: wspd
    resolution: 500
    units: m/s
    file_type: ofw_l2_c02_imagery
  wspd_kts:
    name: wspd_kts
    resolution: 500
    units: kts
    file_type: ofw_l2_c02_imagery
  wnd_dir: 
    name: wnd_dir
    resolution: 500
    units: degrees
    file_type: ofw_l2_c02_imagery
